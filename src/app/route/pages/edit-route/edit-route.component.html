@if (!authenticatedUser) {
  <!-- UNAUTHORIZED ERROR PAGE -->
  <unauthorized></unauthorized>
} @else if (authenticatedUser.profile > 2) {
  <!-- FORBIDDEN ERROR PAGE -->
  <forbidden></forbidden>
} @else {
  <!-- ROUTE FORM (EDIT MODE) -->
  <route-form
    (submitted)="editRoute($event)"
    [formMode]="formMode"
    [route]="initRouteToEdit"
  >
  </route-form>
}
