<!-- HEADER TOOLBAR -->
<mat-toolbar>
  <!-- MENU BUTTON -->
  <button mat-button (click)="menuToggle()">
    @if (menuOpened) {
      <i class="material-icons">keyboard_arrow_left</i>
    } @else {
      <i class="material-icons">menu</i>
    }
  </button>

  <!-- AUTHENTICATED USER BAR -->
  @if (authenticatedUser) {
    <div id="authenticated-user-container">
      <i id="authenticated-user-icon" class="material-icons">account_circle</i>
      <span>
        {{ authenticatedUser.givenName }} {{ authenticatedUser.surname }}
      </span>
      <button mat-button (click)="logout()">
        <i id="authenticated-user-logout-button" class="material-icons">
          logout
        </i>
      </button>
    </div>
  }
</mat-toolbar>
<!-- MENU CONTENT -->
<mat-sidenav-container>
  <mat-sidenav mode="side" [opened]="menuOpened">
    <!-- ABOUT SUBMENU -->
    <button mat-button (click)="openAboutDialog()" class="menu-button">
      <i class="material-icons">info</i>
      <span>À propos</span>
    </button>
  </mat-sidenav>
  <!-- PAGE CONTENT -->
  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
