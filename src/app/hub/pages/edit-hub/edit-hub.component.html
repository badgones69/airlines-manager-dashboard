@if (authenticatedUser) {
  @if (authenticatedUser.profile < 3) {
    @if (initHubToEdit) {
      <!-- HUB FORM (EDIT MODE) -->
      <airport-form
        (submitted)="editHub($event)"
        [formMode]="formMode"
        [formTitle]="formTitle"
        [airport]="initHubToEdit"
        [isHub]="true"
      >
      </airport-form>
    }
  } @else {
    <!-- FORBIDDEN ERROR PAGE -->
    <forbidden></forbidden>
  }
} @else {
  <!-- UNAUTHORIZED ERROR PAGE -->
  <unauthorized></unauthorized>
}
